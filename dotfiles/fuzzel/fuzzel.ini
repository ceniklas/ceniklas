# fuzzel — launcher on sway. macOS counterpart: Raycast on hyper+space.
[main]
font=JetBrainsMono Nerd Font:size=11
terminal=ghostty -e
prompt="> "
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=0
